<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>God Mode · Trivia POO</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="shell game god-mode"><header class="topbar"><a class="brand" href="/">TRIVIA <b>POO</b></a><a class="menu-link" href="/">← Menú</a><span class="score">GOD MODE · <strong th:text="${game.score}">0</strong> PTS</span></header><div class="progress"><span th:style="'width:' + ${game.currentIndex * 100 / game.totalQuestions} + '%'" ></span></div><div class="god-meta"><div class="question-meta"><span>LEVEL 3 · EXPERTO</span><b th:text="${game.questionNumber} + ' / ' + ${game.totalQuestions}">1 / 20</b></div><div class="timer" th:classappend="${answered} ? ' stopped' : ''"><span>TIEMPO</span><strong id="timer">10</strong></div></div><section class="card god-card-content" th:classappend="${answered} ? ' answered' : ''"><h1 th:text="${question.prompt}">Pregunta</h1><form action="/god/answer" method="post" id="god-form"><input type="hidden" name="questionId" th:value="${question.id}"><input type="hidden" name="timedOut" id="timedOut" value="false"><div class="answers god-answers"><label th:each="option, stat : ${question.options}" class="answer" th:classappend="${answered && stat.index == question.correctOption} ? ' correct-answer' : (${answered && stat.index == selectedAnswer} ? ' wrong-answer' : '')"><input type="radio" name="answer" th:value="${stat.index}" th:disabled="${answered}" required><span class="letter" th:text="${'ABCD'.charAt(stat.index)}">A</span><span th:text="${option}">Respuesta</span><span class="mark" th:if="${answered && stat.index == question.correctOption}">✓</span><span class="mark wrong-mark" th:if="${answered && stat.index == selectedAnswer && stat.index != question.correctOption}">×</span></label></div><div th:if="${!answered}" class="god-submit"><button class="primary submit" type="submit">Responder <span>→</span></button></div></form><div th:if="${answered}" class="god-result"><p th:if="${timedOut}" class="timeout-message">Se acabó el tiempo. La respuesta correcta está marcada.</p><p th:unless="${timedOut}" th:classappend="${selectedAnswer == question.correctOption} ? 'success-message' : 'timeout-message'" th:text="${selectedAnswer == question.correctOption} ? '¡Correcto! Buen reflejo.' : 'Respuesta incorrecta. Revisa el concepto.'">Resultado</p><a class="primary button" href="/god/next" th:text="${game.questionNumber == game.totalQuestions} ? 'Ver resultados →' : 'Siguiente pregunta →'">Siguiente pregunta →</a></div></section></main><script>const form=document.getElementById('god-form');const timer=document.getElementById('timer');let seconds=10;const answered=document.querySelector('.god-card-content').classList.contains('answered');if(!answered){const countdown=setInterval(()=>{seconds--;timer.textContent=seconds;if(seconds<=0){clearInterval(countdown);document.getElementById('timedOut').value='true';form.querySelectorAll('input:not([type="hidden"]),button').forEach(e=>e.disabled=true);form.submit();}},1000);}</script></body></html>
