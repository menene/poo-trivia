<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>God Mode · Resultados</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="shell results god-results"><div class="eyebrow">GOD MODE · PARTIDA TERMINADA</div><h1>¿Qué tan<br><span>rápido piensas?</span></h1><div class="score-card god-score"><strong th:text="${game.score} + ' / ' + ${game.totalQuestions}">14 / 20</strong><span>respuestas correctas bajo presión</span><div class="big-percent" th:text="${game.percent} + '%'">70%</div></div><p class="lead" th:if="${game.percent >= 80}">Nivel experto superado. Tu modelo mental de Java está afilado.</p><p class="lead" th:unless="${game.percent >= 80}">El modo experto es para detectar huecos. Vuelve a los niveles y fortalece esos conceptos.</p><div class="actions"><form action="/god/start" method="post"><button class="primary" type="submit">Intentar de nuevo <span>↗</span></button></form><a class="secondary button" href="/">Volver al menú</a></div></main></body></html>
