<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Trivia POO</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="shell home"><div class="eyebrow">CC2008 · SEMESTRE 02, 2026</div><h1>La gran trivia<br><span>de POO</span></h1><p class="lead">Un game show para convertir el repaso del parcial en una partida. Avanza por niveles, demuestra lo que sabes y aprende de cada respuesta.</p><div class="stats"><div><strong th:text="${total}">235</strong><small>preguntas</small></div><div><strong>3</strong><small>niveles</small></div><div><strong>∞</strong><small>intentos</small></div></div><div class="levels"><form th:each="level : ${levels}" action="/start" method="post" class="level-form"><input type="hidden" name="level" th:value="${level.number}"><button class="level-card" type="submit"><span class="level-number" th:text="'0' + ${level.number}">01</span><span class="level-copy"><b th:text="${level.name}">Fundamentos</b><small th:text="${level.description}">Descripción</small></span><em th:text="${level.total} + ' preguntas'">78 preguntas</em><span class="arrow">→</span></button></form><form action="/god/start" method="post" class="level-form"><button class="level-card god-card" type="submit"><span class="level-number">⚡</span><span class="level-copy"><b>God Mode</b><small>20 preguntas expertas · 10 segundos por pregunta</small></span><em>10s</em><span class="arrow">→</span></button></form></div><p class="hint">Sin registro · Las respuestas vienen de tu guía original</p></main></body></html>
