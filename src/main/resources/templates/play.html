<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pregunta · Trivia POO</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="shell game"><header class="topbar"><a class="brand" href="/">TRIVIA <b>POO</b></a><a class="menu-link" href="/">← Menú</a><span class="score">NIVEL <strong th:text="${game.level}">1</strong> · PUNTAJE <strong th:text="${game.score}">0</strong></span></header><div class="progress"><span th:style="'width:' + ${game.currentIndex * 100 / game.totalQuestions} + '%'" ></span></div><div class="question-meta"><span th:text="${question.section}">Sección</span><b th:text="${game.questionNumber} + ' / ' + ${game.totalQuestions}">1 / 78</b></div><section class="card"><h1 th:text="${question.prompt}">Pregunta</h1><details class="reveal"><summary>Revelar respuesta</summary><div class="answer-text" th:text="${question.answer}">Respuesta original de la guía</div></details><form action="/answer" method="post" class="self-check"><input type="hidden" name="questionId" th:value="${question.id}"><p>¿Cómo te fue?</p><div class="check-actions"><button class="primary" name="knew" value="true">Lo sabía <span>✓</span></button><button class="review-button" name="knew" value="false">Necesito repasar <span>↗</span></button></div></form></section><p class="tip">No hay respuestas malas: cada ronda te ayuda a detectar qué tema revisar.</p></main></body></html>
