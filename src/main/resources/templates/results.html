<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Resultados · Trivia POO</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="shell results"><div class="eyebrow">NIVEL <span th:text="${game.level}">1</span> · PARTIDA TERMINADA</div><h1>Tu resultado<br><span>está aquí.</span></h1><div class="score-card"><strong th:text="${game.score} + ' / ' + ${game.totalQuestions}">18 / 78</strong><span>conceptos dominados</span><div class="big-percent" th:text="${game.percent} + '%'">75%</div></div><p class="lead" th:if="${game.percent >= 80}">¡Excelente! Tienes una base muy sólida para el parcial.</p><p class="lead" th:unless="${game.percent >= 80}">Buen trabajo. Revisa las explicaciones y vuelve a intentarlo para consolidar los conceptos.</p><div class="actions"><a class="primary button" href="/">Elegir otro nivel <span>↗</span></a></div></main></body></html>
